name: release

on:
  push:
    # `+` is one-or-more in GitHub's ref-filter syntax (not @actions/glob),
    # so this matches bare-semver tags like 1.0.0 / 1.10.99. `bb release`
    # pushes `git tag <VERSION>` where VERSION is the root VERSION file.
    tags: ['[0-9]+.[0-9]+.[0-9]+']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d  # v13.6.1
        with:
          bb: '1.12.218'

      - name: bb test
        working-directory: cli
        run: bb test

      - name: build uberscript
        working-directory: cli
        run: bb build

      - name: compute sha256
        working-directory: cli
        run: |
          sha256sum dist/c3kit-jig.bb | cut -d' ' -f1 > dist/c3kit-jig.bb.sha256
          ls -lah dist

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: |
            cli/dist/c3kit-jig.bb
            cli/dist/c3kit-jig.bb.sha256
