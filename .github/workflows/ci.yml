name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cli:
    name: CLI (bb test + lint)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        bb: ['1.12.218']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d  # v13.6.1
        with:
          bb: ${{ matrix.bb }}

      - name: clj-kondo
        run: |
          curl -sLO https://raw.githubusercontent.com/clj-kondo/clj-kondo/master/script/install-clj-kondo
          chmod +x install-clj-kondo
          ./install-clj-kondo --dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure git for scaffold e2e tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name  "CI"
          git config --global init.defaultBranch main

      - name: bb test
        working-directory: cli
        run: bb test

      - name: bb lint
        working-directory: cli
        run: bb lint

  security:
    name: security scan
    uses: cleancoders/github-actions/.github/workflows/security.yml@v1
    with:
      src-paths: "cli/src cli/spec"
      shellcheck-dir: "."
      # Repo is semgrep-clean (SHA-pinned actions, no curl|bash), so keep it
      # that way: new findings fail the build instead of sitting red-but-ignored.
      semgrep-blocking: true
