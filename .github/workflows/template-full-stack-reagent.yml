name: template-full-stack-reagent

on:
  push:
    branches: [main]
    paths:
      - 'templates/full-stack-reagent/**'
      - 'cli/**'
      - '.github/workflows/template-full-stack-reagent.yml'
      - 'verification/**'
  pull_request:
    paths:
      - 'templates/full-stack-reagent/**'
      - 'cli/**'
      - '.github/workflows/template-full-stack-reagent.yml'
      - 'verification/**'
  workflow_dispatch:

jobs:
  hook-iso-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: 1.12.218
      - name: Run c3kit-template.bb isolation test
        run: |
          cd templates/full-stack-reagent
          bb spec/hook_test.bb

  coupling-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: 1.12.218
      - name: Static feature-coupling scan
        run: |
          cd verification
          bb scan-coupling

  verify-light:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        combo:
          - memory-minimal
          - memory-content-no-ssr
          - memory-no-websocket
          - sqlite-no-auth
          - postgres-ssr-no-content
          - datomic-pro-no-ssr-no-content
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
          bb: 1.12.218
          clj-kondo: latest
          cljfmt: latest
      - name: Install Playwright browser
        run: npx --yes playwright install --with-deps chromium
      - name: Verify (light)
        run: |
          cd verification
          bb verify --combo ${{ matrix.combo }} --tier light \
            --cli-cp ${{ github.workspace }}/cli/src

  verify-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
          bb: 1.12.218
          clj-kondo: latest
          cljfmt: latest
      - name: Install Playwright browser
        run: npx --yes playwright install --with-deps chromium
      - name: Verify (full, memory-defaults)
        run: |
          cd verification
          bb verify --combo memory-defaults --tier full \
            --cli-cp ${{ github.workspace }}/cli/src

  dep-cve:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        combo:
          - sqlite-no-auth
          - postgres-ssr-no-content
          - datomic-pro-no-ssr-no-content
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
          bb: 1.12.218
      - name: Render combo
        run: |
          cd verification
          bb render --combo ${{ matrix.combo }} --out "$GITHUB_WORKSPACE/scan-target" \
            --cli-cp "$GITHUB_WORKSPACE/cli/src"
      - name: clj-watson dependency CVE scan (blocking)
        working-directory: scan-target/my-app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: clojure -M:clj-watson scan -p deps.edn --database-strategy github-advisory --fail-on-result

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: 1.12.218
      - name: Render features-maximal combo
        run: |
          cd verification
          bb render --combo memory-defaults --out "$GITHUB_WORKSPACE/scan-target" \
            --cli-cp "$GITHUB_WORKSPACE/cli/src"
      - name: clj-holmes SAST (blocking)
        uses: clj-holmes/clj-holmes-action@53daa4da4ff495cccf791e4ba4222a8317ddae9e
        with:
          path: 'scan-target/my-app'
          output-type: 'stdout'
          fail-on-result: 'true'
      - name: Install semgrep
        run: python3 -m pip install --quiet semgrep
      - name: Semgrep (OWASP Top 10 + default, blocking)
        run: semgrep scan --config p/owasp-top-ten --config p/default --error scan-target/my-app
